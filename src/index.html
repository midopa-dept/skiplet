<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skiplet</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="volume.css"><link rel="stylesheet" href="compact.css"></head>
<body>
<main class="shell">
  <header class="toolbar">
    <div class="brand"><span class="brand-mark"></span><span>Skiplet</span></div>
    <div class="header-actions">
      <button id="settingsButton" class="icon-button" type="button" aria-label="단축키 설정" title="단축키 설정"><svg viewBox="0 0 24 24"><path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Z"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l1.7-1.3-2-3.4-2 .8a8 8 0 0 0-2.6-1.5L14.2 3h-4.4l-.3 2.1a8 8 0 0 0-2.6 1.5l-2-.8-2 3.4 1.7 1.3a7.7 7.7 0 0 0 0 3l-1.7 1.3 2 3.4 2-.8a8 8 0 0 0 2.6 1.5l.3 2.1h4.4l.3-2.1a8 8 0 0 0 2.6-1.5l2 .8 2-3.4-1.7-1.3Z"/></svg></button>
      <button id="openButton" class="open-button" type="button"><svg viewBox="0 0 24 24"><path d="M4 7.5h6l1.7 2H20v8.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7.5Z"/><path d="M4 10h16"/></svg>파일 열기</button>
    </div>
  </header>
  <section id="dropZone" class="player" aria-label="오디오 플레이어">
    <div class="track-row"><div class="track-copy"><h1 id="fileName">재생할 파일이 없습니다</h1><div class="state-line"><span class="state-dot"></span><span id="status">파일을 열거나 창에 드롭하세요</span></div></div></div>
    <div class="timeline"><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="재생 위치"><div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div></div>
    <div class="controls">
      <button id="backward" class="skip-button" type="button" aria-label="10초 뒤로"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 1 1-5.4 8.6"/></svg><span id="backwardValue">10</span></button>
      <button id="toggle" class="toggle" type="button" aria-label="재생"><svg viewBox="0 0 24 24"><path class="fill" d="m9 6 9 6-9 6V6Z"/></svg></button>
      <button id="forward" class="skip-button" type="button" aria-label="10초 앞으로"><span id="forwardValue">10</span><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 1 0 5.4 8.6"/></svg></button>
    </div>
    <label class="seek-step">이동 간격 <input id="seekSeconds" type="number" min="1" max="3600" step="1" value="10"> 초</label>
    <div class="volume-row"><svg viewBox="0 0 24 24"><path d="M5 10v4h3l4 3V7l-4 3H5Z"/><path d="M15 9.5a4 4 0 0 1 0 5"/><path d="M17.5 7a7.5 7.5 0 0 1 0 10"/></svg><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="볼륨"><span id="volumeValue">100</span></div>
  </section>
  <footer id="shortcutSummary"></footer>
</main>
<dialog id="shortcutDialog"><form id="shortcutForm" method="dialog">
  <div class="dialog-heading"><div><span class="section-label">KEYBOARD</span><h2>단축키</h2></div><button id="closeSettings" class="icon-button" type="button" aria-label="닫기">×</button></div>
  <p class="dialog-help">입력 칸을 선택한 뒤 원하는 키를 누르세요. 앱이 앞에 있을 때만 작동합니다.</p>
  <label>재생 / 일시정지 <input id="shortcutToggle" class="shortcut-input" readonly data-command="toggle"></label>
  <label>뒤로 이동 <input id="shortcutBackward" class="shortcut-input" readonly data-command="backward"></label>
  <label>앞으로 이동 <input id="shortcutForward" class="shortcut-input" readonly data-command="forward"></label>
  <label>볼륨 올리기 <input id="shortcutVolumeUp" class="shortcut-input" readonly data-command="volumeUp"></label>
  <label>볼륨 내리기 <input id="shortcutVolumeDown" class="shortcut-input" readonly data-command="volumeDown"></label>
  <p id="shortcutError" class="shortcut-error" role="alert"></p>
  <div class="dialog-actions"><button id="resetShortcuts" class="text-button" type="button">기본값 복원</button><button id="saveShortcuts" class="save-button" type="submit">저장</button></div>
</form></dialog>
<audio id="audio"></audio><script src="renderer.js"></script>
</body></html>
